# Render Blueprint for the Gatekeeper backend (FastAPI + WebSocket).
#
# Render supports WebSockets (wss://) with no extra config, and injects $PORT.
#
# There is deliberately NO `dockerCommand` here: Render's blueprint spec does not
# document whether that field is shell-expanded, and an unexpanded literal
# "$PORT" would fail the boot. The Dockerfile CMD is the single source of truth
# for the start command — it is shell form, binds 0.0.0.0, expands ${PORT}, and
# pins --workers 1.
#
# CORS: the dashboard is bundled and served same-origin from this service, so it
# needs no cross-origin grant. The app's defaults allow localhost only, for dev.
services:
  - type: web
    name: gatekeeper-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Pinned so a deployed instance can never boot into LIVE/RealPlc. The app
      # also defaults to SIMULATION (app/config.py) — this is belt and braces.
      - key: MODE
        value: SIMULATION
